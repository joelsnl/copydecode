[project]
name = "copydecode"
version = "0.3.1"
description = "Local KEEP/REPLACE copy-edit and any-language→English translation for EPUB, PDF, text, HTML, and DOCX."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Joel Sunil" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
keywords = [
    "llm",
    "translation",
    "copyedit",
    "epub",
    "pdf",
    "docx",
    "llama.cpp",
    "machine-translation",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "lxml>=6.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/joelsnl/copydecode"
Repository = "https://github.com/joelsnl/copydecode"
Issues = "https://github.com/joelsnl/copydecode/issues"

[project.optional-dependencies]
nllb = ["ctranslate2>=4.5", "transformers>=4.44", "sentencepiece>=0.2"]
pack = ["tokenizers>=0.20", "huggingface_hub>=0.24"]
dev = ["ruff>=0.6"]

[project.scripts]
copydecode = "copydecode.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
