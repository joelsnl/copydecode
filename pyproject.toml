[project]
name = "copydecode"
version = "0.2.0"
description = "Local KEEP/REPLACE copy-edit and any-language→English translation for EPUB, PDF, text, HTML, and DOCX."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Joel Sunil" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
keywords = [
    "llm",
    "translation",
    "copyedit",
    "epub",
    "pdf",
    "docx",
    "llama.cpp",
    "machine-translation",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "lxml>=5.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/joelsnl/copydecode"
Repository = "https://github.com/joelsnl/copydecode"

[project.optional-dependencies]
nllb = ["ctranslate2>=4.5", "transformers>=4.44", "sentencepiece>=0.2"]
pack = ["tokenizers>=0.20", "huggingface_hub>=0.24"]

[project.scripts]
copydecode = "copydecode.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copydecode = ["data/*.json"]
