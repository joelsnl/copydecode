name: publish

# Trusted Publishing: OIDC from this workflow only. No PyPI API token.
# Mutable action tags (@v4 / @release/v1) are how several 2025–2026
# supply-chain incidents injected malware into publish jobs — pin SHAs.

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -E "^version = \"${tag}\"" pyproject.toml
      - run: python -m pip install -U pip build
      - run: python -m build
      - name: Wheel contains only copydecode + dist-info
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          extra = [n for n in names if not (n.startswith("copydecode/") or ".dist-info/" in n)]
          assert not extra, extra
          non_py = [n for n in names if n.startswith("copydecode/") and not n.endswith(".py")]
          assert not non_py, non_py
          print("wheel members ok:", len(names))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/copydecode
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
